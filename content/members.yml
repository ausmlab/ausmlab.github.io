        - "Jacob joined the lab as a Ph.D. student in 2019, after a B.S. in Astrophysics and Statistics from the University of Toronto. He works on 3D point cloud understanding with deep learning, including semantic segmentation, upsampling and diffusion models."
      history:
        - "2019–  Ph.D., Earth and Space Science, York University"
        - "2018  B.S., Astrophysics and Statistics, University of Toronto"
      interests: 3D object detection and point cloud understanding using deep learning
      github: https://github.com/Yacovitch
      photo: jacob-yoo.jpg
      projects:
        - "YUPU: airborne LiDAR point-cloud upsampling benchmark (ECCV 2026 Workshop)"
        - "Multimodal point-cloud segmentation for transmission corridor mapping"
        - "EyeNet++ (IEEE TGRS 2025)"
