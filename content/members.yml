        - "2021–2026  Ph.D., Earth and Space Science, York University"
      interests: AI for autonomous trains and railway perception
      photo: mohammadjavad-ghorbanalivakili.jpg
      projects:
        - "Ego-path segmentation for autonomous trains with vision-language models (ISPRS 2026)"
        - "Sidewalk delivery robots in a campus digital twin"
    - name: Ali Baligh Jahromi
      role: Postdoctoral Fellow
      since: 2026
      bio:
        - "Ali earned his Ph.D. in the lab in 2019 with a thesis on 3D indoor modelling from optical point clouds. He then worked as a postdoctoral fellow at Y-EMERGE, York University. He rejoined the lab in 2026 as a GeoAI researcher and works on the lab's project with the Ontario Ministry of Transportation (MTO)."
      history:
        - "2026–  Postdoctoral Fellow, AUSM Lab, York University"
        - "Postdoctoral Fellow, Y-EMERGE, York University"
        - "2011–2019  Ph.D., Earth and Space Science, York University"
      interests: GeoAI for transportation infrastructure
      photo: ali-baligh-jahromi.jpg
      projects:
        - "GeoAI project with the Ontario Ministry of Transportation (MTO)"
- group: Ph.D. Students
