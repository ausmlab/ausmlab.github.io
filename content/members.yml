# Current lab members, in groups. The order here is the order on the page.
# To add a person, copy one block under the right group and change it.
#   name:      full name
#   role:      shown under the name
#   since:     year they started, e.g. 2026
#   history:   short lines about past positions or degrees (optional)
#   interests: research interests
#   projects:  current projects, one per line (optional)
#   photo:     a file name in static/images/people/ (optional, square photo works best)
#   bio:       one or more short paragraphs for the profile page (optional)
#   github:    personal GitHub address (optional)
#   email / website: optional
# Every member gets a profile page. Their papers are found automatically in the
# complete publication list by surname and initial (e.g. "Yoo, S.").
#   lab_phd:   true if they earned their Ph.D. in this lab (used for the home-page count)
# When someone leaves, move them to alumni.yml.

- group: Principal Investigator
  people:
    - name: Gunho Sohn
      role: Professor of Geomatics Engineering
      bio:
        - "Professor of Geomatics Engineering at the Lassonde School of Engineering, York University, and Director of the Mobility Innovation Centre (MOVE), which he founded and previously led as its inaugural director. From 2023 to June 2026, he served as Chair of the Department of Earth and Space Science and Engineering. He also directs the Augmented Urban Space Modeling Laboratory (AUSMLab), where the lab develops innovative solutions to represent, describe, and understand urban environments through visual and spatial data."
        - "His research develops embodied spatial intelligence – AI systems that perceive, reason about, and act within physical space – for smart construction and autonomous infrastructure monitoring. His group has led large-scale collaborative research programs supported by CFI, NSERC CREATE, ORF-RE, OCI, and industry partners, including the 3D Mobile Mapping AI (3DMMAI) project with Teledyne Optech and the KAIA digital twin project with Aethon Aerial Solutions."
      history:
        - "2026–  Director, Mobility Innovation Centre (MOVE)"
        - "2023–2026  Chair, Dept. of Earth and Space Science and Engineering"
        - "Ph.D., University College London (RSPSoc best thesis, 2004)"
        - "B.Sc. & M.Sc., Astronomy and Space Science, Yonsei University"
      interests: Neural computer vision and robotic perception; autonomous mapping and navigation; 3D urban modelling and digital twins of the built environment; embodied spatial intelligence for smart construction and infrastructure monitoring; AI for Earth and space observation
      photo: gunho-sohn.jpg
      photo_large: gunho-sohn-large.jpg
      email: gsohn@yorku.ca
      website: https://discover.academics.yorku.ca/Gunho.Sohn
      website_label: York profile
      full_profile: https://discover.academics.yorku.ca/Gunho.Sohn

