      role: Postdoctoral Fellow
      since: 2026
      bio:
        - "Mohammadjavad completed his Ph.D. in the lab in September 2026. His dissertation on route-structured perception for railway scene understanding was recommended for a Dissertation Prize. As a postdoctoral fellow, he works on AI for autonomous trains and railway perception."
      history:
