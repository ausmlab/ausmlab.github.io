        - "Sunghwan (Jacob) Yoo received the B.S. degree in Astrophysics and Statistics from the University of Toronto in 2018 and is pursuing the Ph.D. degree in the Department of Earth and Space Science and Engineering, York University. His research interests include computer vision, 3D point cloud semantic segmentation and diffusion models."
