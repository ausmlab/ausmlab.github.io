# Open positions, shown at the top of the Join Us page and on the home page.
# Each position also gets a poster image for LinkedIn (static/images/posters/<id>.png),
# made by tools/make_posters.py, and a 2-page PDF ad (static/files/ausmlab-<id>.pdf)
# made by tools/make_ad_pdf.py. Remove a block when the position is filled.
#
#   id:        short name, used for the poster file (letters, numbers, dashes)
#   title:     the position
#   kicker:    small line above the title
#   status:    e.g. "Open now" or "Applications reviewed on a rolling basis"
#   start:     when the person can start
#   focus:     2-4 research areas (title | one-line detail)
#   offer:     what the lab offers
#   apply:     how to apply
#   poster_image:    background photo for the poster (in static/images/)
#   poster_position: which part of the photo to show, e.g. center 40%
#   subject:   what to write in the email subject line

- id: graduate-2027
  poster_image: gallery/lab-research-2014-a.jpg
  poster_position: center 40%
  kicker: GRADUATE OPPORTUNITIES
  title: Ph.D. and M.Sc. positions
  status: Applications reviewed on a rolling basis
  start: Flexible (Fall, Winter or Summer terms)
  intro: Join our work on structured spatial world models, where drones and robots sense the world, build accurate 3D models of it, and use those models to act.
  focus:
    - "Sensing · Autonomy | Drones, image–LiDAR fusion, tiny-object detection in orbit"
    - "3D World Models | LoD2 buildings, BIM digital twins, Gaussian splatting"
    - "Prediction · Action | Mapping agents, LLM and vision-language-action models"
  offer:
    - Funding through NSERC Discovery, NSERC CREATE SMART and industry partners
    - Industry internships and enhanced stipends through CREATE SMART
    - A GPU computing cluster and real-world data from industry partners
  apply: Email your CV, transcripts, a short research statement and representative publications to gsohn@yorku.ca.
  subject: "[Ph.D. or M.Sc.] Your Name"

- id: postdoc-2027
  poster_image: hero-powerline-lidar.jpg
  poster_position: center 50%
  kicker: POSTDOCTORAL OPPORTUNITIES
  poster_accent: "#7fd3ff"
  poster_tagline: AI world models for cities, Earth and space
  focus_heading: Research thrusts
  about:
    - "The AUSM Lab at York University develops embodied spatial intelligence: AI systems that perceive, reason about and act within physical space. Our work spans urban mobility and robotics, infrastructure digital twins, autonomous mapping, and AI for Earth and space."
    - "We are looking for postdoctoral fellows to lead one of five research thrusts. You will work at the centre of a team of Ph.D. and M.Sc. students, and with industry and government partners such as Teledyne Optech, Aethon Aerial Solutions and the Ontario Ministry of Transportation."
  role:
    - Lead a research thrust, from problem definition to publication
    - Publish in top venues (CVPR, ICCV, ECCV, ISPRS, IEEE TGRS)
    - Co-supervise Ph.D. and M.Sc. students day to day
    - Run industry projects and meet with partners
    - Help write grant and fellowship proposals
  title: Postdoctoral fellows
  status: Applications reviewed on a rolling basis
  start: Flexible (2026–2027)
  intro: Build AI world models that understand and predict cities, infrastructure, the Earth and near-Earth space. Lead a research thrust, mentor graduate students and work directly with industry and government partners.
  focus:
    - "Urban World Models | City-scale robot–mobility interaction; graph models that understand and predict the city"
    - "Scan-to-Model | Infrastructure-knowledge-compatible 3D models from scans"
    - "Embodied Autonomy | Robots, drones and self-driving vehicles that sense, map and act on their own"
    - "Physics-Informed Earth AI | Physics-informed AI for Earth emulation"
    - "Space Situational Awareness | Space-in-the-loop sensing, detection and tracking"
  offer:
    - Funding through NSERC Discovery, NSERC CREATE SMART and industry partners
    - Support to apply for the Canada Postdoctoral Research Award (CPRA) and Mitacs Accelerate fellowships
    - Experience leading industry projects and mentoring graduate students
    - A GPU computing cluster and real-world data from industry partners
  requirements:
    - "A Ph.D. (completed or near completion) in computer vision, machine learning, robotics, photogrammetry and remote sensing, geomatics, or a related field."
    - "A strong publication record in leading venues (e.g., CVPR, ICCV, ECCV, ISPRS, IEEE TGRS)."
    - "Hands-on experience with deep learning (Python, PyTorch) and 3D or spatial data."
  steps:
    - Your CV with a full publication list
    - A research statement (up to two pages)
    - Two or three representative publications
    - Names and contact details of three referees
  poster_apply: "<b>CV, research statement and 2–3 papers</b>"
  funding_note: "Positions are funded through the lab's research grants and industry partners. We also encourage strong candidates to apply with us for external fellowships, such as the Canada Postdoctoral Research Award (CPRA) and Mitacs Accelerate, and we support the application."
  apply: Email your CV with publication list, a research statement of up to two pages, two or three representative publications and the names of three referees to gsohn@yorku.ca.
  subject: "[Postdoc] Your Name"
