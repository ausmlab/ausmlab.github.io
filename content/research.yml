    link_label: Project page
    home: true
  - name: YUTO Semantic
    text: "Aerial LiDAR for 3D semantic segmentation: about 738 million points over 9.46 km² of York campus, nine classes."
    year: "2023"
    link: https://huggingface.co/datasets/ausmlab/yuto-semantic
    link_label: Hugging Face
    home: true
