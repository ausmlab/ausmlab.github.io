# The lab's research direction, shown on the Research page and the home page.
#
# vision:      the goal at the top of the diagram
# pillars:     the three parts of a world model. Each topic line is
#              "Topic | People | Partner or funder". Leave People empty and add
#              "| open" at the end to show "Looking for students" with a link to Join Us.
# applications: where the work is used
# foundation:  the grant that supports all of it
# papers:      under a pillar, 3–4 key papers. Each line is part of a title in publications.yml.

vision:
  title: Structured Spatial World Models
  lead: Our world models are structured. They represent the world as 3D geometry, objects, relations and physics, not just pixels, so that robots, drones and satellites can reason about the world and act in it. What they learn from acting flows back to update the model.
  flagship: Autonomous mapping agents

# thrusts: where the world-model work is applied. Shown on the home page and the
#          Research page as five icon cards. Each line is "Title | one short line".
thrusts:
  - "Urban World Models | Graph models that understand and predict robots and mobility in cities"
  - "Scan-to-Model | Infrastructure models with engineering knowledge, built from scans"
  - "Embodied Autonomy | Robots, drones and cars that sense, map and act in real time"
  - "Physics-Informed Earth AI | AI guided by physics that emulates Earth systems"
  - "Space Situational Awareness | Space in the loop: detecting and tracking objects in orbit"

pillars:
  # One section per research thrust (same order as "thrusts" above).
  # Topic line: topic | people | partner or funding | open (if we are looking for students)
  - id: urban
    short: Urban World Models
    title: Urban World Models
    question: Understand and predict cities
    image: wp/4230-Screenshots.jpg
    body: We build graph models of cities that link streets, buildings, people, robots and vehicles. They let us predict how people and machines move and test changes before they are made.
    topics:
      - Spatial knowledge graph + LLM agents | Md. Ehsan Shahmi Chowdhury | ORF-RE
      - Pedestrian trajectories in Toronto and Seoul | Mohammadjavad Ghorbanalivakili | OCI C2C, with Hanyang University
      - Robots and people sharing city space |  |  | open
    papers:
      - Digital Twin-based Evaluation of Tactical Interventions
  - id: scan
    short: Scan-to-Model
    title: Scan-to-Model
    question: From scans to engineering models
    image: wp/2889-Multi-scale-Layout-CRF-Chao-Luo.jpg
    body: We turn LiDAR and images into clean 3D models of buildings and infrastructure that carry engineering knowledge, from LoD1 to LoD3 and BIM.
    topics:
      - LoD1 to LoD2 building reconstruction | Mohammad Moein Sheikholeslami |
      - Semantic BIM/IFC digital twins | Md. Ehsan Shahmi Chowdhury | with Yonsei University
      - Single-view 3D reconstruction with diffusion priors | Youssef Korny | NSERC Discovery
      - Point cloud upsampling and image–LiDAR fusion | Sunghwan (Jacob) Yoo, Youssef Korny |
      - Gaussian splatting for 3D city models |  |  | open
    papers:
      - GeoPriorPC
      - EyeNet++
      - PolyAttractNet
  - id: autonomy
    short: Embodied Autonomy
    title: Embodied Autonomy
    question: Sense, map and act in real time
    image: gallery/nyct-track-extraction.jpg
    body: Robots, drones, trains and cars need to see, map and decide in real time. We build the perception and mapping that lets them act safely on their own.
    topics:
      - Vision-language models for autonomous trains | Mohammadjavad Ghorbanalivakili, Ashley Varghese |
      - Autonomous mapping agents for drones |  |  | open
      - 3D-grounded vision-language-action models |  |  | open
    papers:
      - Reasoning-guided Ego-path Segmentation
      - The Emerging Role of Vision-Language Models
      - Polarization-Aware Segmentation
  - id: earth
    short: Physics-Informed Earth AI
    title: Physics-Informed Earth AI
    question: AI that respects physics
    image: dataset-plume.jpg
    body: We combine deep learning with physical models to emulate Earth systems, from smokestack plumes and air quality to airflow around people in cities.
    topics:
      - Plume rise from images for air-quality models |  |  | open
      - CFD-calibrated pedestrian simulation | Mohammadjavad Ghorbanalivakili | ORF-RE · NSERC CREATE SMART
    papers:
      - Evaluation of plume rise parameterizations in GEM-MACHv2
  - id: space
    short: Space Situational Awareness
    title: Space Situational Awareness
    question: Space in the loop
    image: dataset-dust.jpg
    body: We detect and track objects in orbit from space-based images and predict where they will go next.
    topics:
      - Tiny resident space object (RSO) detection | Youssef Beshir | with Prof. Regina Lee's lab
      - Diffusion models for RSO imagery | Merna Tamer Youssef | with Prof. Regina Lee's lab
      - Orbit determination and propagation |  |  | open
    papers:
      - On-Orbit Star Tracker Benchmark
      - OrbitTrack
loop_note: Results of action feed back into sensing, closing the loop.

applications:
  - title: Infrastructure · Digital twins
    text: Maps, BIM, power lines and rail
  - title: Mobility · Public health
    text: Delivery robots, pedestrian flow, disease modelling
  - title: Space
    text: Space situational awareness (K-SSA)

foundation:
  title: "NSERC Discovery: Embodied Spatial Intelligence"
  text: The program that supports all of the lab's research

datasets:
  - name: YUTO MMS
    text: A comprehensive SLAM benchmark for urban mobile mapping with tilted LiDAR and panoramic camera integration; four sequences totalling 20.1 km.
    year: IJRR, 2025
    link: https://ausmlab.github.io/yutomms/
    link_label: Project page
    link2: https://github.com/ausmlab/yutomms
    link2_label: GitHub
    image: paper-yutomms-car.jpg
    home: true
  - name: YUTO Semantic
    text: "A large-scale aerial LiDAR dataset for 3D semantic segmentation: ~738 million points covering 9.46 km² of the York University campus, annotated with nine semantic classes."
    year: ISPRS Archives, 2023
    link: https://github.com/ausmlab/yutosemantic
    link_label: GitHub
    link2: https://huggingface.co/datasets/ausmlab/yuto-semantic
    link2_label: Hugging Face
    image: dataset-yutosemantic-map.jpg
    home: true
  - name: Q-Drone UWB Benchmark
    text: Benchmark dataset of ultra-wideband radio based UAV positioning.
    year: IEEE ITSC, 2020
    link: https://benchmark.qdrone.ausmlab.com/
    link_label: Benchmark site
    image: dataset-qdrone.jpg
    home: true
  - name: DUST
    text: "An on-orbit star-tracker benchmark for resident space object (RSO) detection and attitude estimation: 1,378 calibrated near-infrared images from the CASSIOPE Fast Auroral Imager with 4,237 verified RSO annotations. Led by Vithurshan Suthakar (Prof. Regina Lee's lab) with the AUSM Lab."
    year: Zenodo, 2026
    link: https://doi.org/10.5281/zenodo.20255672
    link_label: Zenodo
    link2: https://doi.org/10.1038/s41597-026-07736-9
    link2_label: Paper
    image: dataset-dust.jpg
  - name: YorkU Indoor
    text: "Multi-year indoor positioning dataset from four York University buildings (2021 and 2022): Wi-Fi signal strength, inertial and magnetometer data from Android phones, with HoloLens 2 augmented-reality ground truth. By Afnan Ahmad."
    year: ISPRS IJGI (submitted), 2026
    link: ""
  - name: YUTO Tree5000
    text: A large-scale airborne LiDAR dataset for single tree detection with 5,000 annotated trees.
    year: ICPR Workshops, 2022
    link: ""
  - name: Smokestack Plume Images and Plume Identification Masks
    text: "Images of industrial smokestack plumes in the Athabasca Oil Sands, with plume masks for training deep learning models that measure plume rise. By Mark Gordon (York University) and the AUSM Lab."
    year: Federated Research Data Repository, 2026
    link: https://doi.org/10.20383/103.01448
    link_label: FRDR
    image: dataset-plume.jpg
  - name: Unmanned Aerial Image Dataset
    text: UAV imagery ready for 3D reconstruction.
    year: Data in Brief, 2019
    link: ""

