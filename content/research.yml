# Research themes on the Research page (and the 5 cards on the home page).
#   title / short / body: text
#   image:    a file name in static/images/ (optional)
#   image_note: a short description of the picture
#   projects: name | partner or funder

themes:
  - id: perception
    short: Perception
    title: Robotic Perception & Neural Vision
    body: Deep networks that segment, detect and understand 3D scenes from LiDAR point clouds and imagery, from utility corridors to large outdoor scenes. We also study self-supervised learning, diffusion models and vision-language models.
    image: theme-perception-eyenet.jpg
    image_note: EyeNet results compared with RandLA-Net and ground truth on aerial LiDAR
    projects:
      - "3DMMAI: noise filtering & semantic segmentation of LiDAR | NSERC CRD"
      - "Diffusion models for point cloud upsampling | Ph.D. research"
      - "Polarization-aware camouflaged threat detection from UAVs | Active"

  - id: mapping
    short: Mapping
    title: Autonomous Mapping & Navigation
    body: SLAM and positioning for mobile mapping systems, drones, trains and ground robots. We fuse LiDAR, panoramic cameras, UWB and IMU so platforms know where they are, even without GPS.
    image: theme-mapping-qdrone.jpg
    image_note: Q-Drone UWB positioning system and test sites
    projects:
      - "Railway perception & ego-path segmentation with VLMs | OnTRAC · KRRI"
      - "UWB-aided UAV positioning (Q-Drone) | CREATE DAV"
      - "Delivery robot navigation | with Hanyang University"

  - id: twins
    short: Digital Twins
    title: 3D Urban Modelling & Digital Twins
    body: Automatic building reconstruction and digital twins of the built environment, from terrain models and building footprints to semantic building information models and pedestrian simulation.
    image: theme-twins-campus.jpg
    image_note: Digital twin of the York campus for delivery-robot simulation
    projects:
      - "Building footprints & LoD reconstruction | Ph.D. research"
      - "GeoPriorPC: diffusion priors for building point clouds | Ph.D. research"
      - "Semantic-first BIM/IFC digital twins | with Yonsei University"

  - id: mobility
    short: Infrastructure
    title: AI for Infrastructure & Mobility
    body: Embodied AI for infrastructure monitoring and urban mobility, led through the Mobility Innovation Centre (MOVE).
    image: theme-mobility-rail.jpg
    image_note: Rail track field survey for the autonomous train project
    projects:
      - "AI-enhanced aerial mapping of infrastructure | OCI C2C"
      - "Winter materials management | MTO · MOVE"
      - "Indoor AR navigation for the visually impaired | ISSUM"

  - id: space
    short: Earth & Space
    title: AI for Earth & Space Observation
    body: Remote sensing and space situational awareness. We detect and track resident space objects from on-orbit images, and apply deep learning to environmental and public-health questions.
    image: ""
    image_note: Resident space object detections in a star field
    projects:
      - "RSO detection & tracking (OrbitNet, OrbitTrack) | with Prof. Regina Lee"
      - "Smokestack plume rise for air-quality models | Air-quality research"
      - "Geospatial AI for disease modelling | ORF-RE"

datasets:
