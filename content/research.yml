# The lab's research direction, shown on the Research page and the home page.
#
# vision:      the goal at the top of the diagram
# pillars:     the three parts of a world model. Each topic line is
#              "Topic | People | Partner or funder". Leave People empty and add
#              "| open" at the end to show "Looking for students" with a link to Join Us.
# applications: where the work is used
# foundation:  the grant that supports all of it

vision:
  title: Structured Spatial World Models
  lead: Drones and robots sense the world, build accurate 3D world models, and use those models to predict, decide and act. What they learn from acting flows back to update the model.
  flagship: Autonomous mapping agents

pillars:
  - id: sensing
    short: Sensing
    title: Sensing · Autonomy
    question: See the world now
    body: Drones, mobile mappers and satellites collect LiDAR, imagery and orbital observations. We fuse these sensors and detect what matters in them, from tiny objects in orbit to people on a sidewalk.
    image: theme-mapping-qdrone.jpg
    image_note: Q-Drone UWB positioning system and test sites
    topics:
      - "Image–LiDAR co-serialization | Jacob Yoo, Youssef Korny | OCI C2C · Aethon"
      - "Resident space object (RSO) tiny-object detection | Youssef Beshir | K-SSA, with Prof. Regina Lee's lab"
      - "Pedestrian trajectory sensing | Mohammadjavad Ghorbanalivakili | OCI C2C, with Hanyang University"
      - "Quality-aware drone mapping |  |  | open"

  - id: model
    short: 3D World Model
    title: 3D World Model
    question: Know what the world looks like
    body: We turn sensor data into accurate, structured 3D models of cities and infrastructure, from building geometry to semantic BIM, so machines can reason about space.
    image: wp/2889-Multi-scale-Layout-CRF-Chao-Luo.jpg
    image_note: 3D building models from airborne LiDAR
    topics:
      - "LoD1 to LoD2 building reconstruction | Mohammad Moein Sheikholeslami | "
      - "Semantic-first BIM/IFC digital twins | Md. Ehsan Shahmi Chowdhury | with Yonsei University"
      - "Single-view 3D reconstruction with diffusion priors (GeoPriorPC) | Youssef Korny | NSERC Discovery"
      - "Diffusion models for RSO imagery | Merna Tamer Youssef | K-SSA, with Prof. Regina Lee's lab"
      - "Gaussian splatting for 3D city models |  |  | open"

  - id: action
    short: Prediction · Action
    title: Prediction · Action
    question: Predict what happens before acting
    body: With a world model in hand, agents can plan, simulate and act. We build agents that map on their own, connect spatial graphs to language models, and simulate how people and vehicles move.
    image: wp/4230-Screenshots.jpg
    image_note: Simulating a sidewalk delivery robot in a campus digital twin
    topics:
      - "Spatial graph + LLM agents | Md. Ehsan Shahmi Chowdhury | ORF-RE"
      - "Pedestrian and CFD simulation | Mohammadjavad Ghorbanalivakili | ORF-RE · NSERC CREATE SMART"
      - "Vision-language models for railways | Mohammadjavad Ghorbanalivakili, Ashley Varghese | "
      - "Autonomous mapping agents |  |  | open"
      - "3D-grounded vision-language-action models |  |  | open"

loop_note: Results of action feed back into sensing, closing the loop.

applications:
  - title: Infrastructure · Digital twins
    text: Maps, BIM, power lines and rail
  - title: Mobility · Public health
    text: Delivery robots, pedestrian flow, disease modelling
  - title: Space
    text: Space situational awareness (K-SSA)

foundation:
  title: "NSERC Discovery: Embodied Spatial Intelligence"
  text: The program that supports all of the lab's research

datasets:
  - name: YUTO MMS
    text: A comprehensive SLAM benchmark for urban mobile mapping with tilted LiDAR and panoramic camera integration; four sequences totalling 20.1 km.
    year: IJRR, 2025
    link: https://ausmlab.github.io/yutomms/
    link_label: Project page
    link2: https://github.com/ausmlab/yutomms
    link2_label: GitHub
    image: dataset-yutomms.jpg
    home: true
  - name: YUTO Semantic
    text: "A large-scale aerial LiDAR dataset for 3D semantic segmentation: ~738 million points covering 9.46 km² of the York University campus, annotated with nine semantic classes."
    year: ISPRS Archives, 2023
    link: https://github.com/ausmlab/yutosemantic
    link_label: GitHub
    link2: https://huggingface.co/datasets/ausmlab/yuto-semantic
    link2_label: Hugging Face
    image: dataset-yutosemantic.jpg
    home: true
  - name: Q-Drone UWB Benchmark
    text: Benchmark dataset of ultra-wideband radio based UAV positioning.
    year: IEEE ITSC, 2020
    link: https://benchmark.qdrone.ausmlab.com/
    link_label: Benchmark site
    image: dataset-qdrone.jpg
    home: true
  - name: YUTO Tree5000
    text: A large-scale airborne LiDAR dataset for single tree detection with 5,000 annotated trees.
    year: ICPR Workshops, 2022
    link: ""
  - name: Smokestack Plume Images and Plume Identification Masks
    text: Image dataset for industrial plume rise measurement.
    year: Federated Research Data Repository, 2026
    link: ""
  - name: Unmanned Aerial Image Dataset
    text: UAV imagery ready for 3D reconstruction.
    year: Data in Brief, 2019
    link: ""

