intro:
  - The AUSM Lab develops solutions for representing and understanding urban environments through visual and spatial data.
  - "Our focus is embodied spatial intelligence: AI systems that perceive, reason about and act within physical space, for construction and infrastructure monitoring, extended to Earth and space observation."

