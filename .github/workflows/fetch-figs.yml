name: Fetch paper figures
on:
  push:
    branches: [fetch-figs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf yi figs sd; mkdir -p ot
          curl -sL -m 120 -o /tmp/ot.pdf "https://uc98e53d36edcc5b7f852598e828.dl.dropboxusercontent.com/cd/0/get/DJw9Z2MkHEXDQ_llWFUIXhRwv6MsbJKAg3gtsEDXShTE64PkB8xF-I1o4AqNWslWQJmH_YGe0MvXQ-jFB36qU6iIMLv5zbY7ddxLa1vxjGdGb29D8_6vQLt6jUI1bwgAPpqovZHROb1XXwMv0q6CBiW2vR78pojN4_PjC9Y7zvm3aw/file?c_luid=bfdddea5"
          ls -la /tmp/ot.pdf > ot/log.txt
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1
          pdftoppm -r 110 -jpeg -jpegopt quality=80 /tmp/ot.pdf ot/p
          pdfimages -list /tmp/ot.pdf >> ot/log.txt
          mkdir -p ot/img; pdfimages -png -p /tmp/ot.pdf ot/img/i
          find ot/img -size -40k -delete
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add -A .; git commit -m "fetch sci data figs

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"; git push
