name: Fetch paper figures
on:
  push:
    branches: [fetch-figs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf yi chk; mkdir -p chk
          curl -s -m 20 -w "\nhttp %{http_code}\n" https://ausmlab.com/data/visitors.json > chk/visitors.txt
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add -A .; git commit -m "check visitors json

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"; git push
