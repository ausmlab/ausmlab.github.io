name: Fetch paper figures
on:
  push:
    branches: [fetch-figs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf chk; mkdir -p chk
          echo "token length: ${#GOATCOUNTER_TOKEN}" > chk/log.txt
          python3 tools/fetch_visitors.py >> chk/log.txt 2>&1
          ls -la static/data >> chk/log.txt 2>&1
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add chk; git commit -m "debug visitors

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"; git push
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
