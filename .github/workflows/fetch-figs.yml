name: Fetch paper figures
on:
  push:
    branches: [fetch-figs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf yt; mkdir -p yt
          for id in eMcufkp1TpA WrKYths3D0Q rqVrOgmqa-4 6lD_lo_TP5g TcIcC1tqbmk DQhIIWzXfKg ba8cHzugmBk kHAMGv80YVk A2UWZn3Jm0c Wv0nVAeNIn8 Cwe0FKRblP4 E4AAbt3bsGw T8v2WL--np4 0aCJ76I6dgU JCycMU6YBAs CcsygbCWygg 5vnkoDt-yrk MXYFAFunWwY; do
            curl -sfL -m 30 "https://i.ytimg.com/vi/$id/maxresdefault.jpg" -o yt/$id.jpg || curl -sfL -m 30 "https://i.ytimg.com/vi/$id/hqdefault.jpg" -o yt/$id.jpg
            echo "$id $(wc -c < yt/$id.jpg)" >> yt/log.txt
          done
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add -A .; git commit -m "fetch youtube thumbnails

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"; git push
