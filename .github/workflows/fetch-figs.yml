name: Fetch paper figures
on:
  push:
    branches: [fetch-figs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf astro dns; mkdir -p dns
          for h in indoor.ausmlab.com benchmark.indoor.ausmlab.com dataset.ausmlab.com datasets.ausmlab.com yorkuindoor.ausmlab.com indoor-benchmark.ausmlab.com wifi.ausmlab.com benchmark.ausmlab.com data.ausmlab.com benchmark.qdrone.ausmlab.com yuto.ausmlab.com; do
            echo "== $h $(dig +short $h | tr '\n' ' ')" >> dns/log.txt
            curl -sL -m 20 -o dns/$h.html -w "  http %{http_code} final %{url_effective}\n" https://$h/ >> dns/log.txt
            python3 -c "import re,sys;t=open('dns/$h.html',errors='ignore').read();m=re.search(r'<title>(.*?)</title>',t,re.S);print('  title:',m.group(1).strip()[:120] if m else '-')" >> dns/log.txt
          done
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add -A .; git commit -m "probe subdomains

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"; git push
