name: Fetch paper figures
on:
  push:
    branches: [fetch-figs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf yi figs sd; mkdir -p ot
          curl -sL -m 120 -o /tmp/ot.pdf "https://uc99daa0c83eaee5439be2bb7d51.dl.dropboxusercontent.com/cd/0/get/DJzKh6BPi-8-jJOKPT1Fmvn7oJjHb6VoTQdPUsCL78nmHL272Bzi1Xuqyg3tl6QSzzoTxEfcmcgDuIduu7XVRwSFcYPjGIBbAL9tg1qYAb2sQSaY4I1e8tWKmyvpLW-TnqESj07WZ4b5HWjyT-adwMRbvboCkHmo1zsCV3BoU-mC6Q/file?c_luid=bfdddea5"
          ls -la /tmp/ot.pdf > ot/log.txt
          pip install -q pymupdf >> ot/log.txt 2>&1
          python3 -c "
          import fitz,os
          d=fitz.open('/tmp/ot.pdf'); os.makedirs('ot/img',exist_ok=True)
          for i,pg in enumerate(d):
              pg.get_pixmap(dpi=100).save(f'ot/p{i+1:02d}.jpg')
              for j,im in enumerate(pg.get_images(full=True)):
                  x=fitz.Pixmap(d,im[0])
                  if x.n-x.alpha>=4: x=fitz.Pixmap(fitz.csRGB,x)
                  if x.width*x.height>150000: x.save(f'ot/img/p{i+1:02d}_{j}.png')
          " >> ot/log.txt 2>&1
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add -A .; git commit -m "fetch sci data figs

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"; git push
