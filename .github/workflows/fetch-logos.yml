name: Fetch partner logos
on:
  push:
    branches: [fetch-logos-3]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf fetched3; mkdir -p fetched4
          UA="AUSMLabSite/1.0 (gsohn@yorku.ca)"
          for q in "Universite de Sherbrooke logo" "UdeS logo" "Sherbrooke university logo svg"; do
            curl -sSL -A "$UA" --get "https://commons.wikimedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "list=search" --data-urlencode "srnamespace=6" --data-urlencode "srlimit=8" --data-urlencode "srsearch=$q" | python3 -c "import json,sys;[print(r['title'].replace(' ','_')) for r in json.load(sys.stdin)['query']['search']]" >> fetched4/titles.txt
          done
          sort -u fetched4/titles.txt | grep -i -E "sherbrooke|udes" > fetched4/sel.txt
          while read -r f; do
            iu=$(curl -sSL -A "$UA" --get "https://commons.wikimedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "prop=imageinfo" --data-urlencode "iiprop=url|size" --data-urlencode "titles=$f" | python3 -c "import json,sys;d=json.load(sys.stdin);p=list(d['query']['pages'].values())[0];ii=p.get('imageinfo',[{}])[0];print(ii.get('url','') if ii.get('size',10**9)<3000000 else '')")
            echo "$f -> $iu" >> fetched4/log.txt
            [ -n "$iu" ] && curl -sSL -A "$UA" -o "fetched4/$(echo "$f" | md5sum | cut -c1-8)-$(basename "${iu%%\?*}" | tr -cd 'A-Za-z0-9._-')" "$iu"
          done < fetched4/sel.txt
          ls -la fetched4
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add -A .; git commit -m "Fetched logos 3"; git push
