name: Fetch partner logos
on:
  push:
    branches: [fetch-logos-3]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf fetched fetched2; mkdir -p fetched3
          UA="AUSMLabSite/1.0 (gsohn@yorku.ca)"
          for t in Jade_University_of_Applied_Sciences Université_de_Sherbrooke; do
            curl -sSL -A "$UA" "https://en.wikipedia.org/w/api.php?action=query&format=json&redirects=1&prop=images&imlimit=60&titles=$t" -o fetched3/$t.json
            python3 - "$t" <<'PY' > fetched3/$t.list
          import json,sys
          d=json.load(open(f"fetched3/{sys.argv[1]}.json"))
          for p in d.get('query',{}).get('pages',{}).values():
              for i in p.get('images',[]):
                  n=i['title']
                  if any(k in n.lower() for k in ('logo','wordmark','signature')) and 'commons-logo' not in n.lower():
                      print(n.replace(' ','_'))
          PY
            while read -r f; do
              iu=$(curl -sSL -A "$UA" "https://en.wikipedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url&titles=$f" | python3 -c "import json,sys;d=json.load(sys.stdin);p=list(d['query']['pages'].values())[0];print(p.get('imageinfo',[{}])[0].get('url',''))")
              echo "$t | $f -> $iu" >> fetched3/log.txt
              [ -n "$iu" ] && curl -sSL -A "$UA" -o "fetched3/$(basename "${iu%%\?*}")" "$iu"
            done < fetched3/$t.list
          done
          ls -la fetched3
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add -A .; git commit -m "Fetched logos 3"; git push
